kind = "web"
previewPath = "/"
title = "Royal Ludo Arena"
version = "1.0.0"
id = "artifacts/royal-ludo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20646

[services.development]
run = "pnpm --filter @workspace/royal-ludo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/royal-ludo", "run", "build" ]
publicDir = "artifacts/royal-ludo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20646"
BASE_PATH = "/"
